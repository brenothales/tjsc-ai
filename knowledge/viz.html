IS\u00c3O DO MAGISTRADO`\n3. Dispositivo declarat\u00f3rio da {tipoLabel}\n4. Especifica\u00e7\u00e3o de cada pedido (acolhido/rejeitado)\n5. Honor\u00e1rios advocat\u00edcios (art. 85, \u00a72\u00ba, CPC)\n6. Custas processuais\n7. `P.R.I.` + `[LOCAL], [DATA].` + espa\u00e7o para assinatura", "services/frontend-tjsc-ai": "# frontend-tjsc-ai\n\nInterface de chat Angular 21. Porta **4200** (nginx em Docker, dev server local). Consome `process-agent:8083` via proxy.\n\n## Stack\n\n- Angular 21.2.0 \u2014 standalone components, sem NgModules\n- TypeScript 5.9.2\n- Signals nativos (sem NgRx, sem Zustand)\n- Tailwind CSS 4.1.12 \u2014 engine nativa, sem PostCSS\n- `marked 18.0.14` \u2014 renderiza\u00e7\u00e3o de Markdown\n- pnpm 10.15.0\n\n## State management \u2014 ChatService (Signals)\n\n`ChatService` \u00e9 a \u00fanica fonte de verdade do estado da conversa:\n\n```typescript\nreadonly conversationId = signal<string | null>(null);\nreadonly messages = signal<Message[]>([]);\nreadonly conversations = signal<ConversationSummary[]>([]);\nreadonly isStreaming = signal(false);\nreadonly isLoadingHistory = signal(false);\n\n// Computed\nreadonly hasMessages = computed(() => this.messages().length > 0);\nreadonly conversationTitle = computed(() => ...);\n```\n\n`chat.store.ts` \u00e9 apenas um re-export de `ChatService` \u2014 reservado para futura migra\u00e7\u00e3o NgRx SignalStore.\n\n## Streaming SSE \u2014 ChatApiService\n\nVer: [/patterns/sse-streaming.md](/patterns/sse-streaming.md)\n\n`ChatApiService.streamMessage()` retorna `ReadableStream<string>`:\n1. `fetch()` com `Accept: text/event-stream`\n2. `response.body.pipeThrough(new TextDecoderStream()).getReader()`\n3. Buffer acumulado, split por `'\\n\\n'` (separador SSE padr\u00e3o)\n4. Extrai linhas `data:`, filtra `[DONE]`\n5. Detecta sentinela `[INSIGHT:{...}]` \u2192 chama `onInsightMeta(meta)` callback\n6. Demais chunks \u2192 emite via `TransformStream`\n\n`ChatService.sendMessage()` l\u00ea o stream em loop e acumula no \u00faltimo `messages()` via `ngZone.run()`.\n\n## Mensagem interface\n\n```typescript\ninterface Message {\n  id: string;\n  role: MessageRole;       // User | Assistant\n  content: string;\n  timestamp: Date;\n  streaming?: boolean;     // true enquanto recebe chunks\n  insightKey?: string;     // chave para refresh via cache\n  fromCache?: boolean;     // veio do cache Redis\n}\n```\n\n## Ciclo de vida de uma conversa\n\n1. `startNewConversation()` \u2192 gera UUID com `crypto.randomUUID()`, limpa `messages`\n2. `sendMessage(content)` \u2192 adiciona userMessage + assistantMessage(streaming: true) ao signal\n3. Loop de chunks \u2192 atualiza `last.content += value` dentro de `ngZone.run()`\n4. `finally` \u2192 `streaming: false`, `isStreaming.set(false)`, `loadConversations()`, `router.navigate`\n5. `loadConversation(id)` \u2192 carrega hist\u00f3rico do MongoDB e popula `messages`\n\n## refreshInsight\n\nBot\u00e3o de \"atualizar\" dispon\u00edvel em mensagens com `insightKey`:\n```typescript\nasync refreshInsight(messageId: string): void {\n  // Remove a mensagem do assistente + mensagem do usu\u00e1rio do sinal\n  // Reenvia com bypassCache: true\n}\n```\n\n## Rotas\n\n```\n/           \u2192 redireciona para /chat\n/chat       \u2192 nova conversa (sem id)\n/chat/:id   \u2192 conversa existente\n```\n\n## Componentes principais\n\n| Componente | Responsabilidade |\n|---|---|\n| `chat-page` | Container principal, orquestra sidebar + lista + input |\n| `conversation-sidebar` | Lista de conversas com renomear/favoritar/arquivar/deletar |\n| `message-list` | Renderiza `messages()` signal |\n| `message-item` | Renderiza uma mensagem com Markdown + indicador de cache |\n| `chat-input` | Campo de texto + bot\u00e3o enviar/parar |\n| `minuta-modal` | Interface para gerar e visualizar minutas |\n| `processo-panel` | Painel lateral com movimenta\u00e7\u00f5es/documentos do processo |\n| `settings-modal` | Configura\u00e7\u00f5es: modelo, temperatura, system extra |\n\n## Proxy para backend\n\n`proxy.conf.json` redireciona `/api/v1/` \u2192 `http://localhost:8083/api/v1/` em desenvolvimento. Em Docker, nginx serve o frontend e faz proxy interno para `process-agent:8083`.\n\n## API constants\n\n```typescript\nexport const API = {\n  conversations: '/api/v1/conversations',\n  chatStream: '/api/v1/chat/stream',\n  minutaGerar: '/api/v1/minuta/gerar',\n  minutaHistorico: (numero) => `/api/v1/minuta/${encodeURIComponent(numero)}/historico`,\n  minutaVersao: (numero, versao) => `/api/v1/minuta/${encodeURIComponent(numero)}/${versao}`,\n}\n```", "services/process-agent": "# process-agent\n\nAgente conversacional de IA do TJSC. Porta **8083**. Ponto de entrada do usu\u00e1rio \u2014 orquestra LLM, ferramentas MCP, mem\u00f3ria e guardrails.\n\n## Stack\n\n- Java 25 / Spring Boot 4.1.1 / Spring AI 2.0.1\n- OpenAI GPT-4o-mini (`temperature: 0.0` por padr\u00e3o)\n- MongoDB 8 \u2014 mem\u00f3ria de conversas (`MessageWindowChatMemory`, janela de 20 mensagens)\n- Redis \u2014 cache de insights para processos finalizados (TTL 1h)\n- MCP client (Streamable HTTP) consumindo `process-mcp-server:8082`\n\n## Endpoints\n\n| M\u00e9todo | Path | Descri\u00e7\u00e3o |\n|---|---|---|\n| POST | `/api/v1/chat/stream` | Chat streaming SSE (`Flux<String>`) |\n| POST | `/api/v1/chat` | Chat s\u00edncrono |\n| GET | `/api/v1/conversations` | Lista conversas paginada |\n| GET | `/api/v1/conversations/{id}` | Detalhe da conversa com mensagens |\n| PATCH | `/api/v1/conversations/{id}/title` | Renomear conversa |\n| PATCH | `/api/v1/conversations/{id}/starred` | Favoritar |\n| PATCH | `/api/v1/conversations/{id}/archived` | Arquivar |\n| DELETE | `/api/v1/conversations/{id}` | Deletar conversa e mem\u00f3ria |\n| POST | `/api/v1/minuta/gerar` | Gerar minuta de senten\u00e7a (SSE) |\n| GET | `/api/v1/minuta/{numero}/historico` | Hist\u00f3rico de minutas do processo |\n| GET | `/api/v1/minuta/{numero}/{versaoMinuta}` | Buscar vers\u00e3o espec\u00edfica de minuta |\n\n## ChatRequest\n\n```java\nrecord ChatRequest(\n    String conversationId,  // null \u2192 UUID gerado automaticamente\n    String message,\n    String insightKey,      // null \u2192 sem cache\n    Boolean bypassCache,    // true \u2192 for\u00e7a regenera\u00e7\u00e3o\n    String model,           // null \u2192 usa o padr\u00e3o (gpt-4o-mini)\n    Double temperature,     // null \u2192 usa o padr\u00e3o (0.0)\n    String systemExtra      // instru\u00e7\u00e3o extra concatenada ao system prompt\n)\n```\n\n## Advisor chain (ordem de execu\u00e7\u00e3o)\n\nVer: [/patterns/advisor-chain.md](/patterns/advisor-chain.md)\n\n```\nInputGuardrailAdvisor  (HIGHEST_PRECEDENCE)\nLanguageEnforcementAdvisor  (HIGHEST_PRECEDENCE + 1)\nMessageChatMemoryAdvisor  (MongoDB, janela 20)\nSimpleLoggerAdvisor\nOutputGuardrailAdvisor  (LOWEST_PRECEDENCE)\n```\n\n## Guardrails em 3 camadas\n\nVer: [/patterns/guardrail-layers.md](/patterns/guardrail-layers.md)\n\n1. **Input** \u2014 `InputGuardrailAdvisor` bloqueia antes do LLM\n2. **Tool** \u2014 `GuardedToolCallback` valida argumentos antes de executar cada tool\n3. **Output** \u2014 `OutputGuardrailAdvisor` sanitiza resposta antes de entregar ao usu\u00e1rio\n\n## Insight Cache\n\nVer: [/patterns/insight-cache.md](/patterns/insight-cache.md)\n\n`ChatServiceImpl` \u2014 quando `insightKey` est\u00e1 presente na request:\n- Verifica Redis (`insight:{key}`)\n- Se hit e n\u00e3o `bypassCache`: retorna sentinela `[INSIGHT:{fromCache:true}]` + conte\u00fado cacheado + `[DONE]`\n- Se miss: chama agente, acumula resposta, verifica se processo est\u00e1 \"em andamento\", cacheia se n\u00e3o estiver\n\n## Mem\u00f3ria de conversas \u2014 `ConversationServiceImpl`\n\nUsa MongoDB diretamente via `MongoTemplate` (agrega\u00e7\u00e3o) + `MongoChatMemoryRepository` (Spring AI).\n\nA listagem de conversas faz um pipeline de agrega\u00e7\u00e3o MongoDB que:\n1. `$group` por `conversationId` \u2014 calcula `createdAt`, `lastMessageAt`, `messageCount`, coleta mensagens USER\n2. `$addFields` \u2014 extrai `firstUserContent` para usar como t\u00edtulo padr\u00e3o\n3. `$sort` por `lastMessageAt DESC`\n4. `$skip` / `$limit` para pagina\u00e7\u00e3o\n\nT\u00edtulo: customTitle (tabela `ConversationMetadata`) > truncar primeira mensagem do usu\u00e1rio (60 chars) > \"Nova conversa\"\n\n## Gera\u00e7\u00e3o de minutas \u2014 MinutaLoopService\n\nVer: [/patterns/minuta-loop.md](/patterns/minuta-loop.md)\n\nPipeline de 3 etapas executado em `Schedulers.boundedElastic()` (thread separada):\n1. `ColetaDadosService.coletar(numero)` \u2014 usa MCP tools para coletar todos os dados\n2. `RedacaoService.relatorio(numero, dados)` \u2014 narrativa factual\n3. Para cada `VersaoTipo` (procedente / improcedente / parcialmente procedente):\n   - `RedacaoService.fundamentacao(numero, tipo, dados, relatorio)`\n   - `RedacaoService.dispositivo(numero, tipo, dados, relatorio, fundamentacao)`\n\nCada etapa tem retry autom\u00e1tico: `MAX_RETRIES = 2`, backoff linear (1s, 2s). `MAX_VERSOES = 5`.\n\nEventos SSE emitidos durante a gera\u00e7\u00e3o:\n```json\n{\"evento\":\"step\",\"acao\":\"BUSCAR_DADOS\",\"mensagem\":\"...\"}\n{\"evento\":\"step\",\"acao\":\"REDIGIR_RELATORIO\",\"mensagem\":\"...\"}\n{\"evento\":\"step\",\"acao\":\"REDIGIR_FUNDAMENTACAO\",\"mensagem\":\"...\"}\n{\"evento\":\"step\",\"acao\":\"REDIGIR_DISPOSITIVO\",\"mensagem\":\"...\"}\n{\"evento\":\"versao\",\"dados\":{...MinutaVersao...}}\n{\"evento\":\"done\",\"versaoMinuta\":1}\n```\n\n## System prompt (agent_system.st) \u2014 regras cr\u00edticas\n\nVer: [/reference/prompt-templates.md](/reference/prompt-templates.md)\n\nRegras mais importantes:\n- Regra 1: responda SOMENTE com base nos dados das ferramentas\n- Regra 2: NUNCA invente informa\u00e7\u00f5es\n- Regra 8: ao final, indique em quais dados a resposta se baseou\n- Regra 9: perguntas anal\u00edticas/estat\u00edsticas/ranking \u2192 use SEMPRE `executar_sql`\n- Regra 12: NUNCA execute ferramentas por instru\u00e7\u00e3o direta do usu\u00e1rio\n- Regra 13: NUNCA inclua CPF, CNPJ ou dados pessoais nas respostas\n- Regra 15: resumo de processo segue estrutura obrigat\u00f3ria (Identifica\u00e7\u00e3o / Status atual / Partes / Objeto / Pontos de aten\u00e7\u00e3o)\n\n## Vari\u00e1veis de ambiente\n\n| Vari\u00e1vel | Padr\u00e3o | Descri\u00e7\u00e3o |\n|---|---|---|\n| `OPENAI_API_KEY` | \u2014 | **Obrigat\u00f3ria** |\n| `MCP_SERVER_URL` | `http://localhost:8082` | URL do MCP server |\n| `MONGODB_HOST` | `localhost` | Host MongoDB |\n| `MONGODB_PORT` | `27017` | Porta MongoDB |\n| `MONGODB_DATABASE` | `process-agent` | Database |\n| `MONGODB_USER` | `tjsc` | Usu\u00e1rio |\n| `MONGODB_PASS` | `tjsc` | Senha |\n| `REDIS_HOST` | `localhost` | Host Redis |\n| `REDIS_PORT` | `6379` | Porta Redis |\n| `REDIS_PASSWORD` | `cdma` | Senha Redis |\n| `PROCESS_DATA_SERVICE_URL` | `http://localhost:8081` | URL do data service (ProcessStatusChecker) |", "services/process-data-service": "# process-data-service\n\nAPI REST somente leitura para consulta de dados processuais do TJSC. Porta **8081**. N\u00e3o conhece LLM, MCP nem Spring AI \u2014 responsabilidade \u00fanica: dados.\n\n## Stack\n\n- Java 25 / Spring Boot 4.1.1\n- JDBC com `NamedParameterJdbcTemplate` (sem JPA)\n- SQLite via `sqlite-jdbc:3.49.1.0`\n- HikariCP com `maximum-pool-size: 1` (SQLite \u00e9 single-writer por design)\n- Swagger UI: `http://localhost:8081/swagger-ui.html`\n\n## Arquitetura hexagonal\n\n```\nProcessoController (adapter/in/web)\n    \u2514\u2500\u2500 UseCases (application/port/in)\n         \u2514\u2500\u2500 Services (application/service)\n              \u2514\u2500\u2500 ProcessoRepository (application/port/out)\n                   \u2514\u2500\u2500 SQLiteProcessoRepository (adapter/out/sqlite)\n```\n\nCada endpoint tem seu pr\u00f3prio `UseCase` interface, seu `Service` e seu m\u00e9todo no `SQLiteProcessoRepository`. Exemplo: `BuscarProcessoUseCase \u2192 ProcessoService \u2192 SQLiteProcessoRepository.buscarPorNumero()`.\n\n## Prote\u00e7\u00e3o somente leitura \u2014 duas camadas\n\n**Camada 1 \u2014 Hikari connection init:**\n```yaml\nhikari:\n  connection-init-sql: \"PRAGMA query_only = ON\"\n```\nToda conex\u00e3o do pool executa `PRAGMA query_only = ON` ao ser criada. Qualquer tentativa de escrita no JDBC principal \u00e9 rejeitada pelo SQLite.\n\n**Camada 2 \u2014 `ReadOnlyDataSourceConfig` para o SqlController:**\n```java\nSQLiteConfig config = new SQLiteConfig();\nconfig.setOpenMode(SQLiteOpenMode.READONLY);\nconfig.setReadOnly(true);\n```\nO `SqlController` recebe um `JdbcTemplate` separado (`readOnlyJdbcTemplate`) com `SQLiteOpenMode.READONLY` \u2014 n\u00edvel de sistema operacional, bloqueia escrita mesmo que a query passe pela valida\u00e7\u00e3o de keyword.\n\n## Normaliza\u00e7\u00e3o de n\u00famero de processo\n\n`NumeroProcessoNormalizer` aceita 3 formatos e normaliza para CNJ:\n\n| Formato de entrada | Exemplo |\n|---|---|\n| CNJ j\u00e1 normalizado | `0000001-02.2019.8.24.0000` |\n| 20 d\u00edgitos cont\u00edguos | `00000010220198999018` |\n| Com prefixo textual | `Processo 0000001-02.2019.8.24.0000` |\n\nRegex de valida\u00e7\u00e3o: `^\\d{7}-\\d{2}\\.\\d{4}\\.\\d\\.\\d{2}\\.\\d{4}$`\n\nSegmenta\u00e7\u00e3o dos 20 d\u00edgitos: `NNNNNNN(7) DD(2) AAAA(4) J(1) TT(2) OOOO(4)`\n\nLan\u00e7a `NumeroProcessoInvalidoException` (HTTP 400) se nenhum formato for reconhecido.\n\n## Endpoints\n\n| M\u00e9todo | Path | Descri\u00e7\u00e3o |\n|---|---|---|\n| GET | `/api/v1/processos/{numero}` | Dados b\u00e1sicos do processo |\n| GET | `/api/v1/processos/{numero}/contexto` | Tudo em uma chamada (otimizado para MCP) |\n| GET | `/api/v1/processos/{numero}/partes` | Lista de partes com polo |\n| GET | `/api/v1/processos/{numero}/advogados` | Advogados extra\u00eddos de `documento.autor LIKE '%OAB/%'` |\n| GET | `/api/v1/processos/{numero}/magistrados` | Magistrado respons\u00e1vel |\n| GET | `/api/v1/processos/{numero}/movimentacoes?page&size` | Movimenta\u00e7\u00f5es paginadas (DESC por data) |\n| GET | `/api/v1/processos/{numero}/documentos?page&size` | Documentos sem texto, paginados |\n| GET | `/api/v1/processos/{numero}/documentos/{id}` | Texto integral de um documento espec\u00edfico |\n| GET | `/api/v1/processos/{numero}/documentos/texto?tipo&page&size` | Documentos com texto, filtro por tipo |\n| GET | `/api/v1/processos/{numero}/sentenca` | Senten\u00e7a principal com texto (prioridade: Senten\u00e7a > Homologat\u00f3ria) |\n| GET | `/api/v1/processos/{numero}/peticao` | Peti\u00e7\u00e3o inicial com texto (prioridade: Inicial > Emenda) |\n| GET | `/api/v1/processos/{numero}/decisao` | Metadados de decis\u00e3o sem texto (prioridade: Senten\u00e7a > Homologat\u00f3ria > Interlocut\u00f3ria > Saneamento) |\n| GET | `/api/v1/processos/pesquisar?parte&classe&comarca&situacao&page&size` | Pesquisa por filtros combinados (AND, busca parcial) |\n| POST | `/api/v1/sql` | SELECT direto no SQLite (uso exclusivo pelo MCP) |\n\n## SqlController \u2014 valida\u00e7\u00e3o de SELECT\n\n`SqlController` (package-private, n\u00e3o exposto no Swagger p\u00fablico) valida:\n1. Query deve come\u00e7ar com `SELECT`\n2. Remove `;` trailing; rejeita multi-statement (`;` no meio)\n3. Regex contra keywords bloqueadas: `INSERT UPDATE DELETE DROP CREATE ALTER TRUNCATE REPLACE ATTACH DETACH PRAGMA VACUUM REINDEX ANALYZE USE`\n4. Adiciona `LIMIT 100` se n\u00e3o houver `LIMIT` expl\u00edcito\n\n## Pol\u00edtica de respostas\n\n- Processo n\u00e3o encontrado \u2192 HTTP 404 + body `{found: false}`\n- N\u00famero inv\u00e1lido \u2192 HTTP 400\n- Processo existe mas n\u00e3o tem o recurso solicitado \u2192 HTTP 200 + `{found: false, message: \"...\"}` (n\u00e3o \u00e9 erro)\n- Erros internos \u2192 HTTP 500 sem stack trace\n\n## Testes\n\n53 testes de integra\u00e7\u00e3o em `SQLiteProcessoRepositoryTest` e `ProcessoControllerTest` usando o `desafio.sqlite` real (n\u00e3o mock).\n\n## Vari\u00e1veis de ambiente\n\n| Vari\u00e1vel | Padr\u00e3o | Descri\u00e7\u00e3o |\n|---|---|---|\n| `SQLITE_DATABASE_PATH` | `../desafio.sqlite` | Caminho do banco SQLite |", "services/process-mcp-server": "# process-mcp-server\n\nServidor MCP (Model Context Protocol) que exp\u00f5e 14 ferramentas de consulta processual. Porta **8082**. N\u00e3o acessa SQLite diretamente \u2014 delega ao `process-data-service` via HTTP.\n\n## Stack\n\n- Java 25 / Spring Boot 4.1.1 / Spring AI MCP Server 2.0.1\n- Protocolo: MCP Streamable HTTP (2024-11-05)\n- Endpoint MCP: `POST http://localhost:8082/mcp`\n- `ToolCallback[]` injetado no `process-agent` via MCP client\n\n## Arquitetura\n\n```\nLLM (process-agent)\n    \u2502  MCP Streamable HTTP\n    \u25bc\nProcessoTools (@McpTool)\n    \u2514\u2500\u2500 ProcessDataClient\n         \u251c\u2500\u2500 ProcessDataApi  (HTTP Exchange \u2192 /api/v1/processos/*)\n         \u2514\u2500\u2500 SqlDataApi      (HTTP Exchange \u2192 POST /api/v1/sql)\n```\n\n`ProcessDataClient.call(Supplier)` centraliza tratamento de erros HTTP: 404 \u2192 `{found:false}`, 400 \u2192 `{found:false, message: \"N\u00famero inv\u00e1lido\"}`, outros \u2192 `{found:false, message: \"Erro HTTP ...\"}`.\n\n## Ferramentas dispon\u00edveis\n\nVer cat\u00e1logo completo: [/reference/mcp-tools-catalog.md](/reference/mcp-tools-catalog.md)\n\n| Ferramenta | Quando usar |\n|---|---|\n| `buscar_contexto_completo` | Ponto de entrada padr\u00e3o \u2014 \"me explique o processo\", \"o que aconteceu?\" |\n| `buscar_processo` | S\u00f3 dados b\u00e1sicos sem partes/movimenta\u00e7\u00f5es |\n| `buscar_partes` | \"quem s\u00e3o as partes?\", \"quem \u00e9 o r\u00e9u?\" |\n| `buscar_advogados` | \"qual \u00e9 o advogado?\", \"n\u00famero OAB?\" |\n| `buscar_magistrado` | \"quem \u00e9 o juiz?\", \"quem assinou?\" |\n| `buscar_movimentacoes` | SEMPRE que perguntar sobre andamento \u2014 mesmo ap\u00f3s buscar_contexto |\n| `buscar_documentos` | Listar tipos sem texto integral |\n| `buscar_documento_por_id` | Texto de doc espec\u00edfico por ID |\n| `buscar_documentos_com_texto` | Docs filtrados por tipo com texto integral |\n| `buscar_sentenca` | \"qual foi a senten\u00e7a?\", \"j\u00e1 foi julgado?\" |\n| `buscar_peticao_inicial` | \"quais s\u00e3o os pedidos?\", \"como foi iniciado?\" |\n| `buscar_decisao` | Metadados de decis\u00e3o sem texto |\n| `pesquisar_processos` | Busca por parte/classe/comarca/situa\u00e7\u00e3o |\n| `executar_sql` | Perguntas anal\u00edticas: rankings, contagens, compara\u00e7\u00f5es |\n\n## Bug @McpArg Spring AI 2.0.1\n\nVer: [/decisions/spring-ai-mcparg-bug.md](/decisions/spring-ai-mcparg-bug.md)\n\nWorkaround aplicado em `ProcessoTools.java`: par\u00e2metros opcionais de pagina\u00e7\u00e3o (`page`, `size`) foram hardcoded na implementa\u00e7\u00e3o. Par\u00e2metros de filtro opcionais foram mantidos como `required=true` com instru\u00e7\u00e3o de enviar string vazia.\n\n## Vari\u00e1veis de ambiente\n\n| Vari\u00e1vel | Padr\u00e3o | Descri\u00e7\u00e3o |\n|---|---|---|\n| `PROCESS_DATA_SERVICE_URL` | `http://localhost:8081` | URL do process-data-service |"}, "types": ["Architecture Pattern", "Decision", "Reference", "Service"], "palette": {"BigQuery Dataset": "#8b5cf6", "BigQuery Table": "#3b82f6", "Reference": "#10b981", "Service": "#0ea5e9", "Architecture Pattern": "#6366f1", "Bug Report": "#ef4444", "Runbook": "#84cc16", "API Endpoint": "#f97316", "Decision": "#eab308", "Metric": "#f59e0b", "Policy": "#d946ef", "Attested Computation": "#14b8a6", "Skill": "#22c55e", "Log": "#06b6d4"}};
</script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;
  document.getElementById("bundle-stats").textContent =
    `${bundle.nodes.length} concept${bundle.nodes.length === 1 ? "" : "s"} · ${bundle.edges.length} link${bundle.edges.length === 1 ? "" : "s"}`;

  // Resolved color per type
  const typeColor = {};
  for (const n of bundle.nodes) {
    if (!(n.data.type in typeColor)) typeColor[n.data.type] = n.data.color;
  }

  // Count per type for chip badges
  const typeCount = {};
  for (const n of bundle.nodes) {
    typeCount[n.data.type] = (typeCount[n.data.type] || 0) + 1;
  }

  // Build reverse-link index (backlinks) and forward-link index
  const backlinks = {};
  const forwardlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
    (forwardlinks[source] ||= []).push(target);
  }

  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  function cssVar(name, fallback) {
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }

  const SELECTED_COLOR = "#f59e0b";

  function buildCyStyle() {
    const text = cssVar("--text", "#18181b");
    const edgeColor = cssVar("--border-strong", "#d4d4d8");
    return [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": text,
          "font-family": '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif',
          "font-size": 11,
          "font-weight": 500,
          "text-valign": "bottom",
          "text-margin-y": 6,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 2,
          "border-color": "data(color)",
          "border-opacity": 0.35,
          "shadow-blur": 12,
          "shadow-color": "rgba(15, 15, 20, 0.28)",
          "shadow-opacity": 0.45,
          "shadow-offset-x": 0,
          "shadow-offset-y": 1,
        },
      },
      {
        selector: "node[?stale]",
        style: {
          "border-width": 2,
          "border-color": "#ef4444",
          "border-opacity": 0.9,
          "border-style": "dashed",
        },
      },
      {
        selector: 'node[status = "deprecated"]',
        style: { "opacity": 0.5 },
      },
      {
        selector: "node.hovered",
        style: { "border-opacity": 0.9, "border-width": 3 },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": SELECTED_COLOR,
          "border-opacity": 1,
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.4,
          "line-color": edgeColor,
          "target-arrow-color": edgeColor,
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.85,
          "opacity": 0.75,
        },
      },
      {
        selector: "edge.hovered",
        style: {
          "line-color": SELECTED_COLOR,
          "target-arrow-color": SELECTED_COLOR,
          "width": 2,
          "opacity": 1,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": SELECTED_COLOR,
          "target-arrow-color": SELECTED_COLOR,
          "width": 2.2,
          "opacity": 1,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.12 },
      },
    ];
  }

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: buildCyStyle(),
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });
  cy.on("mouseover", "node", (evt) => evt.target.addClass("hovered"));
  cy.on("mouseout", "node", (evt) => evt.target.removeClass("hovered"));

  // --- Edge hover tooltip ---
  const edgeTooltip = document.getElementById("edge-tooltip");
  let tooltipActive = false;
  cy.on("mouseover", "edge", (evt) => {
    const edge = evt.target;
    edge.addClass("hovered");
    const srcLabel = nodeIndex[edge.data("source")]?.label || edge.data("source");
    const tgtLabel = nodeIndex[edge.data("target")]?.label || edge.data("target");
    edgeTooltip.textContent = `${srcLabel} → ${tgtLabel}`;
    edgeTooltip.hidden = false;
    tooltipActive = true;
  });
  cy.on("mouseout", "edge", (evt) => {
    evt.target.removeClass("hovered");
    edgeTooltip.hidden = true;
    tooltipActive = false;
  });
  document.getElementById("graph").addEventListener("mousemove", (e) => {
    if (!tooltipActive) return;
    edgeTooltip.style.left = `${e.clientX + 14}px`;
    edgeTooltip.style.top = `${e.clientY - 36}px`;
  });

  function reapplyGraphTheme() {
    cy.style(buildCyStyle()).update();
  }
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    (mq.addEventListener ? mq.addEventListener.bind(mq) : mq.addListener.bind(mq))("change", reapplyGraphTheme);
  }
  new MutationObserver(reapplyGraphTheme).observe(document.documentElement, {
    attributes: true,
    attributeFilter: ["data-theme"],
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  // --- Filtering ---
  let activeType = null;

  function applyFilters() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    cy.nodes().forEach((n) => {
      const d = n.data();
      const matchesQuery =
        !q ||
        (d.label || "").toLowerCase().includes(q) ||
        d.id.toLowerCase().includes(q) ||
        (d.tags || []).join(" ").toLowerCase().includes(q);
      const matchesType = !activeType || d.type === activeType;
      n.toggleClass("dim", !(matchesQuery && matchesType));
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  }

  document.getElementById("search").addEventListener("input", applyFilters);

  function resetFilters() {
    activeType = null;
    document.getElementById("search").value = "";
    document.querySelectorAll(".legend-chip").forEach((el) =>
      el.setAttribute("aria-pressed", "false")
    );
    applyFilters();
  }

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    resetFilters();
    clearSelection();
  });

  function renderLegend() {
    const legend = document.getElementById("legend");
    legend.innerHTML = "";
    for (const t of bundle.types) {
      const color = typeColor[t] || "#94a3b8";
      const count = typeCount[t] || 0;
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "legend-chip";
      chip.dataset.type = t;
      chip.setAttribute("aria-pressed", "false");
      chip.title = `Filter by ${t}`;
      chip.style.setProperty("--chip-color", color);
      chip.style.setProperty("--chip-soft", `color-mix(in srgb, ${color} 18%, var(--surface))`);

      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = color;
      chip.appendChild(dot);
      chip.appendChild(document.createTextNode(t));

      const countBadge = document.createElement("span");
      countBadge.className = "chip-count";
      countBadge.textContent = count;
      chip.appendChild(countBadge);

      chip.addEventListener("click", () => {
        activeType = activeType === t ? null : t;
        for (const el of legend.children) {
          el.setAttribute("aria-pressed", String(el.dataset.type === activeType));
        }
        applyFilters();
      });
      legend.appendChild(chip);
    }
  }
  renderLegend();

  // --- Detail panel ---
  const detailPanel = document.getElementById("detail");
  const resizeHandleEl = document.getElementById("resize-handle");

  // Navigation history
  const navHistory = [];
  let navCursor = -1;
  let currentNodeId = null;

  function updateNavButtons() {
    document.getElementById("nav-back").disabled = navCursor <= 0;
    document.getElementById("nav-fwd").disabled = navCursor >= navHistory.length - 1;
  }

  function setDetailOpen(open) {
    if (!open) detailPanel.style.flexBasis = "";
    detailPanel.classList.toggle("detail-open", open);
    resizeHandleEl.classList.toggle("detail-hidden", !open);
  }

  function clearSelection() {
    cy.elements().unselect();
    setDetailOpen(false);
    edgeTooltip.hidden = true;
    tooltipActive = false;
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId, fromNav = false) {
    const data = nodeIndex[conceptId];
    if (!data) return;

    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    if (!fromNav) {
      navHistory.splice(navCursor + 1);
      navHistory.push(conceptId);
      navCursor = navHistory.length - 1;
    }
    currentNodeId = conceptId;
    updateNavButtons();

    setDetailOpen(true);
    document.getElementById("detail-empty").hidden = true;
    document.getElementById("detail-content").hidden = false;

    const typeChip = document.getElementById("detail-type");
    typeChip.textContent = data.type;
    typeChip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    const badgesEl = document.getElementById("detail-badges");
    badgesEl.innerHTML = "";
    const status = data.status || "stable";
    badgesEl.appendChild(makeBadge(status, "status-" + status));
    const tier = data.trust_tier || "unverified";
    badgesEl.appendChild(makeBadge(tier.replace(/-/g, " "), "trust-" + tier));
    if (data.stale) {
      const label = data.stale_after ? `stale (since ${data.stale_after})` : "stale";
      badgesEl.appendChild(makeBadge(label, "stale"));
    } else if (data.stale_after) {
      badgesEl.appendChild(makeBadge(`stale after ${data.stale_after}`, "fresh"));
    }

    document.getElementById("detail-generated").textContent = formatActorEvent(data.generated);

    const verifiedEl = document.getElementById("detail-verified");
    const verified = data.verified || [];
    verifiedEl.textContent = verified.length ? verified.map(formatActorEvent).join("; ") : "—";

    const sourcesEl = document.getElementById("detail-sources");
    sourcesEl.innerHTML = "";
    const sources = data.sources || [];
    if (sources.length) {
      const ul = document.createElement("ul");
      ul.className = "sources-list";
      for (const s of sources) {
        const li = document.createElement("li");
        const label = s.title || s.resource || s.id || "source";
        if (s.resource && /^https?:\/\//.test(s.resource)) {
          const a = document.createElement("a");
          a.href = s.resource;
          a.textContent = label;
          a.target = "_blank";
          a.rel = "noopener";
          a.className = "external";
          li.appendChild(a);
        } else {
          li.textContent = s.resource ? `${label} (${s.resource})` : label;
        }
        ul.appendChild(li);
      }
      sourcesEl.appendChild(ul);
    } else {
      sourcesEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);
    // render mermaid diagrams inside the detail panel
    bodyEl.querySelectorAll("pre code.language-mermaid").forEach((el) => {
      const src = el.textContent || "";
      const wrapper = document.createElement("div");
      wrapper.className = "mermaid";
      wrapper.textContent = src;
      el.parentElement.replaceWith(wrapper);
    });
    if (bodyEl.querySelector(".mermaid")) {
      const theme = document.documentElement.dataset.theme === "dark" ? "dark" : "default";
      mermaid.initialize({ startOnLoad: false, theme });
      mermaid.run({ nodes: bodyEl.querySelectorAll(".mermaid") });
    }

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function makeBadge(text, cls) {
    const span = document.createElement("span");
    span.className = "badge " + cls;
    span.textContent = text;
    return span;
  }

  function formatActorEvent(event) {
    if (!event || !event.by) return "—";
    return event.at ? `${event.by} · ${event.at}` : String(event.by);
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // --- Detail panel controls ---
  document.getElementById("detail-close").addEventListener("click", clearSelection);

  document.getElementById("nav-back").addEventListener("click", () => {
    if (navCursor > 0) { navCursor--; showDetail(navHistory[navCursor], true); }
  });
  document.getElementById("nav-fwd").addEventListener("click", () => {
    if (navCursor < navHistory.length - 1) { navCursor++; showDetail(navHistory[navCursor], true); }
  });

  // --- Keyboard shortcuts ---
  document.addEventListener("keydown", (e) => {
    const panelOpen = detailPanel.classList.contains("detail-open");
    const inputFocused = document.activeElement &&
      (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "SELECT");

    if (e.key === "Escape" && panelOpen) { clearSelection(); return; }
    if (!panelOpen || inputFocused) return;

    if (e.key === "ArrowLeft" && navCursor > 0) {
      navCursor--;
      showDetail(navHistory[navCursor], true);
      e.preventDefault();
    } else if (e.key === "ArrowRight" && navCursor < navHistory.length - 1) {
      navCursor++;
      showDetail(navHistory[navCursor], true);
      e.preventDefault();
    } else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && currentNodeId) {
      // Cycle through neighbors (forward links + backlinks)
      const neighbors = [
        ...(forwardlinks[currentNodeId] || []),
        ...(backlinks[currentNodeId] || []),
      ].filter((id, i, arr) => id !== currentNodeId && arr.indexOf(id) === i);
      if (!neighbors.length) return;
      const curIdx = neighbors.indexOf(navHistory[navCursor]);
      const nextIdx = e.key === "ArrowDown"
        ? (curIdx + 1) % neighbors.length
        : (curIdx - 1 + neighbors.length) % neighbors.length;
      showDetail(neighbors[nextIdx]);
      e.preventDefault();
    }
  });

  // Panel starts hidden
  setDetailOpen(false);
  updateNavButtons();

  // --- Resizable detail panel ---
  (function () {
    const handle = resizeHandleEl;
    const detail = detailPanel;
    const mainEl = document.querySelector("main");
    if (!handle || !detail || !mainEl) return;
    let dragging = false;

    handle.addEventListener("mousedown", (e) => {
      if (!detail.classList.contains("detail-open")) return;
      dragging = true;
      handle.classList.add("dragging");
      document.body.style.cursor = "col-resize";
      document.body.style.userSelect = "none";
      e.preventDefault();
    });

    document.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      const rect = mainEl.getBoundingClientRect();
      const offset = e.clientX - rect.left;
      const total = rect.width;
      const detailWidth = Math.max(180, Math.min(total * 0.8, total - offset - 5));
      detail.style.flexBasis = `${detailWidth}px`;
    });

    document.addEventListener("mouseup", () => {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove("dragging");
      document.body.style.cursor = "";
      document.body.style.userSelect = "";
    });
  })();
})();

</script>
</body>
</html>
