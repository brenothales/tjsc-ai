<div class="flex flex-col gap-8 px-6 py-8 max-w-3xl mx-auto w-full">
  @if (chat.isLoadingHistory()) {
    <div class="flex justify-center py-12">
      <app-spinner />
    </div>
  } @else if (!chat.hasMessages()) {
    <div class="flex flex-col items-center justify-center flex-1 text-center py-24">
      <h2 class="text-2xl font-semibold text-gray-300 mb-2">{{ 'app.titulo' | translate }}</h2>
      <p class="text-gray-500 text-sm">{{ 'chat.como_ajudar' | translate }}</p>
    </div>
  } @else {
    @for (msg of chat.messages(); track msg.id) {
      <app-message-item [message]="msg" />
    }
  }
  <div #bottom></div>
</div>
