<div
  class="flex gap-4"
  [class.justify-end]="message().role === MessageRole.User"
>
  <div [class.max-w-[75%]]="message().role === MessageRole.User" class="flex flex-col gap-1.5 w-full">
    <div
      [class.user-bubble]="message().role === MessageRole.User"
      [class.rounded-2xl]="message().role === MessageRole.User"
      [class.rounded-br-sm]="message().role === MessageRole.User"
      [class.px-5]="message().role === MessageRole.User"
      [class.py-3]="message().role === MessageRole.User"
      [class.py-1]="message().role === MessageRole.Assistant"
    >
      <div
        class="prose prose-invert max-w-none leading-relaxed"
        [class.text-inherit]="message().role === MessageRole.User"
        processoTooltip
        [innerHTML]="html()"
      ></div>
      @if (message().streaming) {
        <span class="inline-block w-1.5 h-4 bg-current animate-pulse ml-0.5 align-middle"></span>
      }
    </div>

    @if (message().role === MessageRole.Assistant && message().insightKey && !message().streaming) {
      <div class="flex items-center gap-2 px-1">
        @if (message().fromCache) {
          <span class="text-xs text-gray-600 flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
            {{ 'mensagem.cache' | translate }}
          </span>
        }
        <button
          (click)="refresh()"
          [disabled]="chat.isStreaming()"
          class="flex items-center gap-1 text-xs text-gray-500 hover:text-indigo-400 disabled:opacity-40 transition-colors"
          [title]="'mensagem.nova_resposta_titulo' | translate"
        >
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
          {{ 'mensagem.nova_resposta' | translate }}
        </button>
      </div>
    }
  </div>
</div>
