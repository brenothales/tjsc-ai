<div class="flex h-screen bg-black text-gray-100 overflow-hidden">
  <app-conversation-sidebar
    [open]="sidebarOpen()"
    (toggleSidebar)="toggleSidebar()"
  />

  <main class="flex flex-col flex-1 min-w-0">
    <header class="flex items-center gap-3 px-4 py-3 border-b border-gray-800 shrink-0">
      @if (!sidebarOpen()) {
        <button
          (click)="toggleSidebar()"
          class="p-2 rounded-lg hover:bg-gray-800 transition-colors"
          [attr.aria-label]="'chat.abrir_sidebar' | translate"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      }
      <h1 class="font-semibold text-sm truncate flex-1">
        {{ chat.conversationTitle() ?? ('chat.nova_conversa' | translate) }}
      </h1>
      <button
        (click)="theme.toggle()"
        class="p-2 rounded-lg hover:bg-gray-800 transition-colors shrink-0 text-gray-400 hover:text-gray-200"
        [title]="(theme.isDark() ? 'tema.claro' : 'tema.escuro') | translate"
      >
        @if (theme.isDark()) {
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M17.657 17.657l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
          </svg>
        } @else {
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
          </svg>
        }
      </button>
    </header>

    <app-message-list class="flex-1 overflow-y-auto" />

    <app-chat-input
      class="shrink-0"
      [disabled]="chat.isStreaming()"
      (send)="onSend($event)"
      (stop)="chat.stopStreaming()"
    />
  </main>

  <app-processo-panel />

  @if (minuta.isOpen()) {
    <app-minuta-modal />
  }
</div>
