<!-- Backdrop -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm"
  (click)="cancel()"
>
  <!-- Modal -->
  <div
    class="relative w-full max-w-md mx-4 bg-gray-900 border border-gray-700 rounded-xl shadow-2xl"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="flex items-center justify-between px-5 py-4 border-b border-gray-800">
      <h2 class="text-sm font-semibold text-gray-100">{{ 'configuracoes.titulo' | translate }}</h2>
      <button
        (click)="cancel()"
        class="p-1.5 rounded-lg hover:bg-gray-800 text-gray-500 hover:text-gray-300 transition-colors"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="px-5 py-5 flex flex-col gap-6">

      <!-- Model -->
      <div class="flex flex-col gap-2">
        <label class="text-xs font-semibold text-gray-400 uppercase tracking-widest">{{ 'configuracoes.modelo' | translate }}</label>
        <div class="flex flex-col gap-1.5">
          @for (m of models; track m.id) {
            <button
              (click)="setModel(m.id)"
              class="flex items-center gap-3 px-3 py-2.5 rounded-lg border transition-colors text-left"
              [class.border-indigo-600]="draft().model === m.id"
              [class.bg-indigo-900/30]="draft().model === m.id"
              [class.text-indigo-300]="draft().model === m.id"
              [class.border-gray-700]="draft().model !== m.id"
              [class.bg-gray-800]="draft().model !== m.id"
              [class.text-gray-300]="draft().model !== m.id"
            >
              <span
                class="w-3.5 h-3.5 rounded-full border-2 shrink-0 transition-colors"
                [class.border-indigo-500]="draft().model === m.id"
                [class.bg-indigo-500]="draft().model === m.id"
                [class.border-gray-600]="draft().model !== m.id"
              ></span>
              <span class="text-sm">{{ m.label }}</span>
            </button>
          }
        </div>
      </div>

      <!-- Temperature -->
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <label class="text-xs font-semibold text-gray-400 uppercase tracking-widest">{{ 'configuracoes.temperatura' | translate }}</label>
          <span class="text-xs font-mono font-bold text-indigo-400">{{ draft().temperature.toFixed(1) }}</span>
        </div>
        <input
          type="range"
          min="0" max="2" step="0.1"
          [value]="draft().temperature"
          (input)="setTemperature($any($event.target).value)"
          class="w-full h-1.5 rounded-full appearance-none bg-gray-700 accent-indigo-500 cursor-pointer"
        />
        <div class="flex justify-between text-[10px] text-gray-600">
          <span>{{ 'configuracoes.preciso' | translate }}</span>
          <span>{{ 'configuracoes.criativo' | translate }}</span>
        </div>
      </div>

      <!-- System extra -->
      <div class="flex flex-col gap-2">
        <label class="text-xs font-semibold text-gray-400 uppercase tracking-widest">{{ 'configuracoes.instrucoes' | translate }}</label>
        <textarea
          rows="4"
          [placeholder]="'configuracoes.instrucoes_placeholder' | translate"
          class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2.5 text-sm text-gray-200 placeholder:text-gray-600 outline-none focus:border-indigo-600 resize-none transition-colors"
          [value]="draft().systemExtra"
          (input)="setSystemExtra($any($event.target).value)"
        ></textarea>
        <p class="text-[10px] text-gray-600">{{ 'configuracoes.instrucoes_hint' | translate }}</p>
      </div>

    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-2 px-5 py-4 border-t border-gray-800">
      <button
        (click)="cancel()"
        class="px-4 py-2 rounded-lg text-sm text-gray-400 hover:text-gray-200 hover:bg-gray-800 transition-colors"
      >
        {{ 'configuracoes.cancelar' | translate }}
      </button>
      <button
        (click)="save()"
        class="px-4 py-2 rounded-lg text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition-colors"
      >
        {{ 'configuracoes.salvar' | translate }}
      </button>
    </div>
  </div>
</div>
